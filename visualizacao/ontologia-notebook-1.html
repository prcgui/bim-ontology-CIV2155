  <script>
  (() => {
    const root=document.getElementById('bim-ontology-n1');
    const data=JSON.parse(root.querySelector('#bim-ontology-data').textContent);
    const el=id=>root.querySelector('#'+id);
    const schemaMap=Object.fromEntries(data.schemaNodes.map(n=>[n.id,n]));
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=n=>Number(n).toLocaleString('pt-BR');
    const defaultRoom=data.rooms.find(r=>data.entities[r.room].name==='COZINHA')||data.rooms[0];
    let state={view:'schema',concept:'result',room:defaultRoom.room,fill:null,path:0,node:'result'};
    let graphNodes=[],graphEdges=[];
    const visibleState=()=>({view:state.view,concept:state.concept,room:state.room,fill:state.fill,path:state.path,node:state.node});
    function applySaved(saved) {
      const s=saved?.privateContent;
      if (!s || !['schema','instance'].includes(s.view)) return;
      if (schemaMap[s.concept])state.concept=s.concept;
      if (data.rooms.some(r=>r.room===s.room))state.room=s.room;
      state.view=s.view;state.fill=s.fill;state.path=Number.isInteger(s.path)?s.path:0;state.node=s.node||'result';
    }
    function save() {
      const api=window.openai;
      if (api?.setWidgetState)api.setWidgetState({modelContent:{visao:state.view,conceito:state.concept,ambiente:data.entities[state.room]?.name,esquadria:data.entities[state.fill]?.name},privateContent:visibleState()}).catch(()=>{});
    }
    const option=(value,label)=>`<option value="${esc(value)}">${esc(label)}</option>`;
    el('bim-concept').innerHTML=data.schemaNodes.map(n=>option(n.id,n.name+' · '+n.types.join(' / '))).join('');
    el('bim-room').innerHTML=data.rooms.map(r=>option(r.room,data.entities[r.room].name+' · '+data.entities[r.room].guid.slice(0,6))).join('');
    function instanceGraph(room) {
      let fill=room.fills.find(f=>f.uri===state.fill)||room.fills.find(f=>data.entities[f.uri].name==='PA2')||room.fills[0];
      state.fill=fill?.uri||null;
      el('bim-fill').innerHTML=room.fills.map(f=>option(f.uri,data.entities[f.uri].name+' · '+data.entities[f.uri].types.join(' / ')+' · '+data.entities[f.uri].guid.slice(0,6))).join('');
      el('bim-fill').value=state.fill||'';
      el('bim-fill-field').hidden=!fill;
      let path=fill?.paths[Math.min(Math.max(0,state.path),fill.paths.length-1)];
      state.path=path?fill.paths.indexOf(path):0;
      el('bim-path-field').hidden=!fill||fill.paths.length<2;
      el('bim-path').innerHTML=(fill?.paths||[]).map((p,i)=>option(i,'Recorte '+(i+1)+' de '+fill.paths.length+' · '+p.area.toLocaleString('pt-BR',{maximumFractionDigits:4})+' m²')).join('');
      el('bim-path').value=String(state.path);
      const items=[['space',room.room,'Ambiente'],['result',room.result,'Resultado por ambiente']];
      if (path)items.push(['interface',path.interface,'Interface'],['fill',fill.uri,data.entities[fill.uri].name],['cut',path.cut,'Recorte '+path.cut.split('/').pop()],['wall',path.wall,'Parede '+data.entities[path.wall].name],['opening',path.opening,'Abertura IFC']);
      const nodes=items.map(([id,uri,name])=>({id,uri,name,types:data.entities[uri].types,own:['result','interface','cut'].includes(id)}));
      const edges=[{source:'space',target:'result',predicate:'civ:resultado'},{source:'result',target:'space',predicate:'civ:ambiente'}];
      if (path)edges.push({source:'result',target:'interface',predicate:'civ:interface'},{source:'result',target:'fill',predicate:'civ:esquadriaAssociada'},{source:'interface',target:'wall',predicate:'civ:paredeHospedeira'},{source:'cut',target:'interface',predicate:'civ:interfaceFonte'},{source:'cut',target:'fill',predicate:'civ:preenchimento'},{source:'cut',target:'opening',predicate:'civ:aberturaFonte'});
      const status=room.state==='associacao_executada'?'Associação executada':room.state==='associacao_executada_com_pendencias'?'Associação executada com pendências':'Preparo inconclusivo';
      el('bim-context').textContent=data.entities[room.room].name+' · '+status+' · '+(room.count===null?'Contagem de esquadrias indisponível':room.count+' esquadrias associadas')+(path?' · Recorte '+(state.path+1)+'/'+fill.paths.length:'');
      return [nodes,edges];
    }
    function render() {
      const isSchema=state.view==='schema';
      el('bim-view-schema').setAttribute('aria-pressed',String(isSchema));
      el('bim-view-instance').setAttribute('aria-pressed',String(!isSchema));
      el('bim-concept-field').hidden=!isSchema;
      el('bim-room-field').hidden=isSchema;
      el('bim-fill-field').hidden=true;el('bim-path-field').hidden=true;
      el('bim-concept').value=state.concept;el('bim-room').value=state.room;
      if (isSchema) {
        graphNodes=data.schemaNodes;graphEdges=data.schemaEdges;state.node=state.concept;
        el('bim-context').textContent='Classes principais · números nos nós: instâncias · números nas setas: relações observadas no RDF';
      } else {
        const room=data.rooms.find(r=>r.room===state.room)||defaultRoom;
        [graphNodes,graphEdges]=instanceGraph(room);
        if (!graphNodes.some(n=>n.id===state.node))state.node='result';
      }
      draw();details();
    }
    function draw() {
      const host=el('bim-graph');const width=Math.max(host.clientWidth,280);
      const columns=width>=620?3:width>=440?2:1;
      const nodeWidth=Math.min(184,width/columns-24);
      const order=state.view==='schema'?['site','building','storey','space','result','interface','fill','cut','wall','opening','railing','shade']:['space','result','interface','fill','cut','wall','opening'];
      const used=order.filter(id=>graphNodes.some(n=>n.id===id));
      const height=Math.ceil(used.length/columns)*126;
      host.style.height=height+'px';
      const points={};used.forEach((id,i)=>points[id]={x:width/columns*(i%columns+.5),y:64+Math.floor(i/columns)*126});
      const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');
      svg.setAttribute('class','graph-lines');svg.setAttribute('width',width);svg.setAttribute('height',height);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('aria-hidden','true');
      const defs=document.createElementNS(ns,'defs');
      for (const [id,color] of [['normal','var(--border)'],['active','var(--viz-series-1)']]) {
        const marker=document.createElementNS(ns,'marker');marker.setAttribute('id','bim-arrow-'+id);marker.setAttribute('viewBox','0 0 10 10');marker.setAttribute('refX','9');marker.setAttribute('refY','5');marker.setAttribute('markerWidth','6');marker.setAttribute('markerHeight','6');marker.setAttribute('orient','auto-start-reverse');
        const triangle=document.createElementNS(ns,'path');triangle.setAttribute('d','M 0 0 L 10 5 L 0 10 z');triangle.style.fill=color;marker.append(triangle);defs.append(marker);
      }
      svg.append(defs);host.replaceChildren(svg);
      const sorted=[...graphEdges].sort((a,b)=>Number(a.source===state.node||a.target===state.node)-Number(b.source===state.node||b.target===state.node));
      for (const edge of sorted) {
        const a=points[edge.source],b=points[edge.target];if(!a||!b)continue;
        const active=edge.source===state.node||edge.target===state.node;
        const sameRow=Math.abs(a.y-b.y)<1;const sameColumn=Math.abs(a.x-b.x)<1;
        const sign=b.x>=a.x?1:-1;let sx,sy,tx,ty,d;
        if(sameRow) {
          sx=a.x+sign*nodeWidth/2;tx=b.x-sign*nodeWidth/2;sy=a.y;ty=b.y;
          const bend=edge.predicate==='civ:ambiente'?45:-45;
          d=`M${sx},${sy} C${sx+sign*25},${sy+bend} ${tx-sign*25},${ty+bend} ${tx},${ty}`;
        } else if(sameColumn) {
          const dir=b.y>a.y?1:-1;sx=a.x;tx=b.x;sy=a.y+dir*34;ty=b.y-dir*34;
          const adjacent=Math.abs(a.y-b.y)<140;
          d=adjacent?`M${sx},${sy} L${tx},${ty}`:`M${sx},${sy} C${Math.min(width-10,sx+nodeWidth/2+10)},${sy} ${Math.min(width-10,tx+nodeWidth/2+10)},${ty} ${tx},${ty}`;
        } else {
          sx=a.x+sign*nodeWidth/2;tx=b.x-sign*nodeWidth/2;sy=a.y;ty=b.y;
          d=`M${sx},${sy} C${sx+sign*22},${sy} ${tx-sign*22},${ty} ${tx},${ty}`;
        }
        const line=document.createElementNS(ns,'path');line.setAttribute('d',d);line.setAttribute('class','edge'+(active?' active':''));line.setAttribute('marker-end','url(#bim-arrow-'+(active?'active':'normal')+')');svg.append(line);
        if(active && columns>1) {
          const mid=line.getPointAtLength(line.getTotalLength()*.5);const text=document.createElementNS(ns,'text');
          text.setAttribute('x',Math.max(80,Math.min(width-80,mid.x)));text.setAttribute('y',sameRow?(edge.predicate==='civ:ambiente'?a.y+49:a.y-43):mid.y+(b.y>a.y&&!sameColumn?20:-6));text.setAttribute('text-anchor','middle');text.setAttribute('class','edge-label text-small');
          text.textContent=edge.predicate.split(':')[1]+(edge.count!==undefined?' · '+fmt(edge.count):'');svg.append(text);
        }
      }
      for (const node of graphNodes) {
        const p=points[node.id];const wrapper=document.createElement('div');wrapper.className='graph-node';wrapper.style.left=p.x+'px';wrapper.style.top=p.y+'px';wrapper.style.width=nodeWidth+'px';
        const button=document.createElement('button');button.type='button';button.className='btn btn-block';button.setAttribute('aria-pressed',String(state.node===node.id));button.dataset.node=node.id;
        let secondary=node.types.join(' / ');
        if(node.id==='fill'&&state.view==='schema')secondary='beo:Door / Window';
        button.innerHTML='<span class="node-content"><span>'+esc(node.name)+'</span><span class="text-small node-sub">'+esc(secondary)+'</span>'+(state.view==='schema'?'<span class="text-small">'+fmt(node.count)+(node.count===1?' instância':' instâncias')+'</span>':'')+'</span>';
        button.addEventListener('click',()=>{state.node=node.id;if(state.view==='schema'){state.concept=node.id;el('bim-concept').value=node.id;}draw();details();save();});
        wrapper.append(button);host.append(wrapper);
      }
    }
    function details() {
      const node=graphNodes.find(n=>n.id===state.node);if(!node)return;
      const title=state.view==='schema'?node.name+' · '+fmt(node.count)+' instâncias':node.name;
      let html='<div><strong>'+esc(title)+'</strong></div>';
      if(state.view==='schema') {
        html+='<div class="text-small identity">'+node.types.map((t,i)=>'<a href="'+esc(node.own?'https://github.com/prcgui/bim-ontology-CIV2155/blob/main/codigo/Vocabulario.ttl':node.uris[i])+'" target="_blank" rel="noopener noreferrer">'+esc(t)+'</a>').join(' / ')+(node.types.length>1?' · agrupamento visual de duas classes':'')+'</div>';
        const edges=graphEdges.filter(e=>e.source===node.id||e.target===node.id);
        html+='<div class="table-responsive"><table class="table table-sm"><thead><tr><th>De</th><th>Relação</th><th>Para</th><th class="text-end">Ocorrências</th></tr></thead><tbody>'+edges.map(e=>'<tr><td>'+esc(schemaMap[e.source].name)+'</td><td>'+esc(e.predicate)+'</td><td>'+esc(schemaMap[e.target].name)+'</td><td class="text-end tabular-nums">'+fmt(e.count)+'</td></tr>').join('')+'</tbody></table></div>';
        if(node.attributes.length)html+='<details><summary>Atributos observados</summary><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Propriedade</th><th class="text-end">Ocorrências</th></tr></thead><tbody>'+node.attributes.map(a=>'<tr><td>'+esc(a.name)+'</td><td class="text-end tabular-nums">'+fmt(a.count)+'</td></tr>').join('')+'</tbody></table></div></details>';
      } else {
        const entity=data.entities[node.uri];
        html+='<div class="text-small">'+esc(entity.types.join(' / '))+(entity.guid?' · GUID '+esc(entity.guid):'')+'</div>';
        html+='<div class="text-small identity"><code>'+esc(node.uri)+'</code></div>';
        const related=graphEdges.filter(e=>e.source===node.id||e.target===node.id);
        const label=id=>graphNodes.find(n=>n.id===id)?.name||id;
        html+='<div class="table-responsive"><table class="table table-sm"><thead><tr><th>De</th><th>Relação</th><th>Para</th></tr></thead><tbody>'+related.map(e=>'<tr><td>'+esc(label(e.source))+'</td><td>'+esc(e.predicate)+'</td><td>'+esc(label(e.target))+'</td></tr>').join('')+'</tbody></table></div>';
        html+='<details><summary>Propriedades no RDF</summary><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Propriedade</th><th>Valor</th></tr></thead><tbody>'+entity.props.map(([p,v])=>'<tr><td>'+esc(p)+'</td><td>'+esc(v)+'</td></tr>').join('')+'</tbody></table></div></details>';
      }
      el('bim-detail').innerHTML=html;
    }
    el('bim-view-schema').addEventListener('click',()=>{state.view='schema';state.node=state.concept;render();save();});
    el('bim-view-instance').addEventListener('click',()=>{state.view='instance';state.node='result';render();save();});
    el('bim-concept').addEventListener('change',e=>{state.concept=e.target.value;state.node=state.concept;render();save();});
    el('bim-room').addEventListener('change',e=>{state.room=e.target.value;state.fill=null;state.path=0;state.node='result';render();save();});
    el('bim-fill').addEventListener('change',e=>{state.fill=e.target.value;state.path=0;render();save();});
    el('bim-path').addEventListener('change',e=>{state.path=Number(e.target.value);render();save();});
    applySaved(window.openai?.widgetState);render();
    let lastWidth=0;new ResizeObserver(entries=>{const w=entries[0].contentRect.width;if(Math.abs(w-lastWidth)>1){lastWidth=w;draw();}}).observe(el('bim-graph'));
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){applySaved(event.detail.globals.widgetState);render();}});
  })();
  </script>
</div>
